
services:
  postgres:
    image: postgres:17-alpine
    container_name: newtonite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newtonite_ops
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
